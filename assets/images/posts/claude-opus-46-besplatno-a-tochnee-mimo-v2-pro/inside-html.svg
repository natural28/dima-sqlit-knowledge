  <text x="146" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Пример через HTML</text>
  <text x="146" y="248" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="28">figure + img + figcaption</text>
  <text x="684" y="162" fill="#F5F3FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Когда нужен контроль</text>
  <text x="684" y="276" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Подписи, классы, размеры,</text>
  <text x="684" y="310" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="24">более аккуратная верстка.</text>
  <text x="684" y="442" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="24">Это полезно, когда картинка</text>
  <text x="684" y="476" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="24">должна быть частью структуры</text>
  <text x="684" y="510" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="24">и иметь отдельную подпись.</text>
