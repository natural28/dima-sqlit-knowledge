{% if site.yandex_metrika_id %}
  <script>
    window.siteAnalyticsId = {{ site.yandex_metrika_id }};

    window.loadSiteAnalytics = function() {
      if (window.siteAnalyticsLoaded || !window.siteAnalyticsId) {
        return;
      }

      window.siteAnalyticsLoaded = true;

      (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j = 0; j < document.scripts.length; j++) {
          if (document.scripts[j].src === r) {
            return;
          }
        }
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a);
      })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=' + window.siteAnalyticsId, 'ym');

      ym(window.siteAnalyticsId, 'init', {
        ssr: true,
        webvisor: true,
        clickmap: true,
        ecommerce: "dataLayer",
        referrer: document.referrer,
        url: location.href,
        accurateTrackBounce: true,
        trackLinks: true
      });
    };

    if (localStorage.getItem('site-cookie-consent') === 'analytics') {
      window.loadSiteAnalytics();
    }
  </script>
{% endif %}

<style>
  .cookie-consent {
    position: fixed;
    left: 18px;
    bottom: 18px;
    z-index: 60;
    display: none;
    width: min(520px, calc(100vw - 36px));
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md, 16px);
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    color: var(--text-main);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }

  .cookie-consent.is-visible {
    display: block;
  }

  .cookie-consent__title {
    margin: 0 0 8px;
    color: var(--text-main);
    font-size: 16px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .cookie-consent__text {
    margin: 0;
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1.55;
  }

  .cookie-consent__text + .cookie-consent__text {
    margin-top: 8px;
  }

  .cookie-consent__link {
    color: var(--accent);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 0.18em;
  }

  .cookie-consent__actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }

  .cookie-consent__button {
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-soft);
    color: var(--text-main);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, color 180ms ease;
  }

  .cookie-consent__button:hover {
    transform: translateY(-1px);
    border-color: var(--line-strong);
  }

  .cookie-consent__button--primary {
    border-color: transparent;
    background: linear-gradient(135deg, #e0f7ff, var(--accent), #93e5ff);
    color: #082532;
    box-shadow: 0 14px 34px rgba(56, 189, 248, 0.24);
  }

  .cookie-consent__button--primary:hover {
    border-color: transparent;
    color: #082532;
  }

  @media (max-width: 560px) {
    .cookie-consent {
      left: 10px;
      right: 10px;
      bottom: 66px;
      width: auto;
      padding: 16px;
      border-radius: 18px;
    }

    .cookie-consent__actions {
      flex-direction: column;
    }

    .cookie-consent__button {
      width: 100%;
    }
  }
</style>
