<section class="cookie-consent" id="cookie-consent" aria-label="Настройки cookies и аналитики">
  <p class="cookie-consent__title">Cookies и аналитика</p>
  <p class="cookie-consent__text">Используем cookies и localStorage для работы сайта. Аналитику Яндекс Метрики включаем только с вашего согласия.</p>
  <p class="cookie-consent__text">Подробнее: <a class="cookie-consent__link" href="{{ '/cookies/' | relative_url }}">как используются cookies</a>.</p>
  <div class="cookie-consent__actions">
    <button class="cookie-consent__button" type="button" data-cookie-consent="necessary">Только необходимые</button>
    <button class="cookie-consent__button cookie-consent__button--primary" type="button" data-cookie-consent="analytics">Разрешить аналитику</button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const consentBanner = document.getElementById('cookie-consent');
    const storedConsent = localStorage.getItem('site-cookie-consent');

    if (!consentBanner || storedConsent) {
      return;
    }

    consentBanner.classList.add('is-visible');

    consentBanner.querySelectorAll('[data-cookie-consent]').forEach((button) => {
      button.addEventListener('click', () => {
        const consent = button.dataset.cookieConsent;
        localStorage.setItem('site-cookie-consent', consent);
        consentBanner.classList.remove('is-visible');

        if (consent === 'analytics' && window.loadSiteAnalytics) {
          window.loadSiteAnalytics();
        }
      });
    });
  });
</script>
