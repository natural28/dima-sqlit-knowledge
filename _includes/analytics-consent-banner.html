<section class="cookie-consent" id="cookie-consent" aria-label="&#1053;&#1072;&#1089;&#1090;&#1088;&#1086;&#1081;&#1082;&#1080; cookies &#1080; &#1072;&#1085;&#1072;&#1083;&#1080;&#1090;&#1080;&#1082;&#1080;">
  <p class="cookie-consent__title">Cookies &#1080; &#1072;&#1085;&#1072;&#1083;&#1080;&#1090;&#1080;&#1082;&#1072;</p>
  <p class="cookie-consent__text">&#1048;&#1089;&#1087;&#1086;&#1083;&#1100;&#1079;&#1091;&#1077;&#1084; cookies &#1080; localStorage &#1076;&#1083;&#1103; &#1088;&#1072;&#1073;&#1086;&#1090;&#1099; &#1089;&#1072;&#1081;&#1090;&#1072;. &#1040;&#1085;&#1072;&#1083;&#1080;&#1090;&#1080;&#1082;&#1091; &#1071;&#1085;&#1076;&#1077;&#1082;&#1089; &#1052;&#1077;&#1090;&#1088;&#1080;&#1082;&#1080; &#1074;&#1082;&#1083;&#1102;&#1095;&#1072;&#1077;&#1084; &#1090;&#1086;&#1083;&#1100;&#1082;&#1086; &#1089; &#1074;&#1072;&#1096;&#1077;&#1075;&#1086; &#1089;&#1086;&#1075;&#1083;&#1072;&#1089;&#1080;&#1103;.</p>
  <p class="cookie-consent__text">&#1055;&#1086;&#1076;&#1088;&#1086;&#1073;&#1085;&#1077;&#1077;: <a class="cookie-consent__link" href="{{ '/cookies/' | relative_url }}">&#1082;&#1072;&#1082; &#1080;&#1089;&#1087;&#1086;&#1083;&#1100;&#1079;&#1091;&#1102;&#1090;&#1089;&#1103; cookies</a>.</p>
  <div class="cookie-consent__actions">
    <button class="cookie-consent__button" type="button" data-cookie-consent="necessary">&#1058;&#1086;&#1083;&#1100;&#1082;&#1086; &#1085;&#1077;&#1086;&#1073;&#1093;&#1086;&#1076;&#1080;&#1084;&#1099;&#1077;</button>
    <button class="cookie-consent__button cookie-consent__button--primary" type="button" data-cookie-consent="analytics">&#1056;&#1072;&#1079;&#1088;&#1077;&#1096;&#1080;&#1090;&#1100; &#1072;&#1085;&#1072;&#1083;&#1080;&#1090;&#1080;&#1082;&#1091;</button>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const consentBanner = document.getElementById('cookie-consent');
    const storedConsent = localStorage.getItem('site-cookie-consent');

    if (!consentBanner || storedConsent) {
      return;
    }

    consentBanner.classList.add('is-visible');

    consentBanner.querySelectorAll('[data-cookie-consent]').forEach((button) => {
      button.addEventListener('click', () => {
        const consent = button.dataset.cookieConsent;
        localStorage.setItem('site-cookie-consent', consent);
        consentBanner.classList.remove('is-visible');

        if (consent === 'analytics' && window.loadSiteAnalytics) {
          window.loadSiteAnalytics();
        }
      });
    });
  });
</script>
